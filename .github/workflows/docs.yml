name: Documentación

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
      - README.md
      - Makefile
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml
      - README.md
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Comprobar documentación
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Instalar herramientas
        run: python -m pip install -r docs/requirements.txt
      - name: Construir sitio
        run: python -m mkdocs build --strict --config-file docs/mkdocs.yml
      - name: Identificar versión del sitio
        run: python docs/check_deployment.py --write-version docs/site
      - name: Comprobar origen de GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::En Settings → Pages → Build and deployment → Source selecciona GitHub Actions. La publicación desde una rama genera otro sitio con Jekyll y sobrescribe MkDocs."
            exit 1
          fi
      - name: Preparar GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Guardar sitio
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Publicar documentación
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Comprobar sitio publicado
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          DOCS_REVISION: ${{ github.sha }}
        run: python3 docs/check_deployment.py --url "$PAGES_URL" --revision "$DOCS_REVISION"
